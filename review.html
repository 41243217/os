<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>錯題回顧</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <a class="back" href="index.html">← 返回主頁</a>
      <h1>錯題回顧</h1>

      <section class="card block">
        <div class="row wrap gap">
          <label>章節
            <select id="chapter-filter">
              <option value="all">全部</option>
              <option value="CH5">CH5</option>
              <option value="CH6">CH6</option>
              <option value="CH8">CH8</option>
              <option value="CH9">CH9</option>
            </select>
          </label>

          <label>題型
            <select id="type-filter">
              <option value="all">全部</option>
              <option value="single">單選題</option>
              <option value="multiple">多選題</option>
              <option value="text">填充題</option>
            </select>
          </label>

          <button id="clear-btn" type="button" class="danger">清除所有錯題</button>
        </div>
      </section>

      <section id="wrong-list" class="stack"></section>
    </main>

    <script src="common.js"></script>
    <script src="review.js"></script>
  </body>
</html>
