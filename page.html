<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>最新題庫總覽</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <div class="header">
        <h1>最新題庫總覽</h1>
        <a class="btn secondary" href="./index.html">回首頁</a>
      </div>

      <section class="panel">
        <div class="grid stats">
          <article class="card"><p class="small muted">章節檔案數</p><h3 id="chapterFiles">0</h3></article>
          <article class="card"><p class="small muted">合計題數</p><h3 id="totalQuestions">0</h3></article>
          <article class="card"><p class="small muted">single</p><h3 id="totalSingle">0</h3></article>
          <article class="card"><p class="small muted">multiple</p><h3 id="totalMultiple">0</h3></article>
          <article class="card"><p class="small muted">text</p><h3 id="totalText">0</h3></article>
        </div>
      </section>

      <section class="panel" style="margin-top:16px">
        <div id="overviewStatus" class="message"></div>
        <table class="table" style="margin-top:10px">
          <thead>
            <tr>
              <th>章節</th>
              <th>總題數</th>
              <th>single</th>
              <th>multiple</th>
              <th>text</th>
            </tr>
          </thead>
          <tbody id="overviewBody"></tbody>
        </table>
      </section>
    </main>

    <script src="./common.js"></script>
    <script src="./page.js"></script>
  </body>
</html>
